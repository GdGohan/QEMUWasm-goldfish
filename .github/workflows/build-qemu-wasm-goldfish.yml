name: build-qemu-wasm-goldfish

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "goldfish-patches/**"
      - ".github/workflows/build-qemu-wasm-goldfish.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Seu repositorio: precisa conter a pasta goldfish-patches/ com
      # os arquivos .c/.h e o script integrate-goldfish.sh
      - name: Checkout deste repositorio
        uses: actions/checkout@v4
        with:
          path: patches

      # Base: QEMU moderno + backend TCG para WebAssembly
      - name: Clonar qemu-wasm
        run: git clone --depth 1 https://github.com/ktock/qemu-wasm.git qemu-wasm

      # Copia os novos arquivos de dispositivo/maquina goldfish para
      # dentro da arvore do qemu-wasm
      - name: Instalar os arquivos da placa goldfish
        run: |
          set -eu
          SRC=patches/goldfish-patches
          DST=qemu-wasm

          mkdir -p "$DST/hw/arm" "$DST/hw/timer" \
                   "$DST/include/hw/timer" "$DST/include/hw/arm"

          cp "$SRC/hw_arm_goldfish.c" "$DST/hw/arm/goldfish.c"
          cp "$SRC/hw_arm_goldfish_pdev_bus.c" "$DST/hw/arm/goldfish_pdev_bus.c"
          cp "$SRC/hw_timer_goldfish_timer.c" "$DST/hw/timer/goldfish_timer.c"
          cp "$SRC/include_hw_timer_goldfish_timer.h" \
             "$DST/include/hw/timer/goldfish_timer.h"
          cp "$SRC/include_hw_arm_goldfish_pdev_bus.h" \
             "$DST/include/hw/arm/goldfish_pdev_bus.h"

      # Registra os arquivos novos no Kconfig/meson.build. Feito por
      # append idempotente (nao patch de linha) porque nao temos como
      # validar numero de linha exato sem o checkout real do repo.
      #
      # IMPORTANTE: todo o texto multi-linha usado aqui e passado via
      # printf com '\n' explicito, numa unica linha logica de shell --
      # de proposito, para nunca ter uma linha com indentacao menor
      # que a deste bloco "run: |". Um heredoc ou string literal com
      # quebras de linha reais "cruas" dentro deste bloco fecharia o
      # bloco YAML mais cedo do que o esperado (qualquer linha com
      # indentacao abaixo da primeira linha do bloco termina o
      # literal), e o restante seria interpretado como YAML solto,
      # quebrando o workflow.
      - name: Registrar a placa goldfish no build system
        run: |
          set -eu
          cd qemu-wasm

          add_once() {
            # add_once <arquivo> <marcador-de-idempotencia> <texto>
            file="$1"; marker="$2"; text="$3"
            if ! grep -qF "$marker" "$file" 2>/dev/null; then
              printf '%s\n' "$text" >> "$file"
            fi
          }

          add_once hw/arm/Kconfig "config GOLDFISH" "$(printf 'config GOLDFISH\n    bool\n    select GOLDFISH_PIC\n    select GOLDFISH_TTY\n    select GOLDFISH_TIMER\n    select GOLDFISH_PDEV_BUS\n')"

          add_once hw/arm/Kconfig "config GOLDFISH_PDEV_BUS" "$(printf 'config GOLDFISH_PDEV_BUS\n    bool\n')"

          add_once hw/timer/Kconfig "config GOLDFISH_TIMER" "$(printf 'config GOLDFISH_TIMER\n    bool\n')"

          add_once hw/arm/meson.build "goldfish.c" "arm_ss.add(when: 'CONFIG_GOLDFISH', if_true: files('goldfish.c'))"

          add_once hw/arm/meson.build "goldfish_pdev_bus.c" "arm_ss.add(when: 'CONFIG_GOLDFISH_PDEV_BUS', if_true: files('goldfish_pdev_bus.c'))"

          add_once hw/timer/meson.build "goldfish_timer.c" "system_ss.add(when: 'CONFIG_GOLDFISH_TIMER', if_true: files('goldfish_timer.c'))"

          DEFCONFIG="configs/devices/arm-softmmu/default.mak"
          if [ -f "$DEFCONFIG" ]; then
            add_once "$DEFCONFIG" "CONFIG_GOLDFISH=y" "CONFIG_GOLDFISH=y"
          fi

      # Aplica qualquer patch adicional versionado à parte (para
      # ajustes finos que não caibam no add_once acima)
      - name: Aplicar patches adicionais (se existirem)
        run: |
          set -eu
          if [ -d patches/goldfish-patches/diffs ]; then
            cd qemu-wasm
            for p in ../patches/goldfish-patches/diffs/*.patch; do
              [ -e "$p" ] || continue
              echo "Aplicando $p"
              git apply --3way "$p"
            done
          fi

      # O Dockerfile do qemu-wasm fixa ZLIB_VERSION=1.3.1 e baixa de
      # https://zlib.net/zlib-1.3.1.tar.xz. O zlib.net so mantem a
      # ultima versao nesse caminho direto (hoje 1.3.2) e move
      # versoes antigas para /fossils/ -- por isso a URL antiga passou
      # a devolver uma pagina de erro em vez do .tar.xz, e o "tar xJ"
      # falha com "File format not recognized". Corrige apontando pro
      # caminho de fossils; se isso tambem falhar no futuro, trocar
      # pelo mirror do GitHub (github.com/madler/zlib/releases).
      - name: Corrigir URL do zlib no Dockerfile do qemu-wasm
        run: |
          set -eu
          # fossils/ só guarda .tar.gz, não .tar.xz — então trocamos
          # a extensão e a flag do tar (xJC -> xzC) junto com o host
          sed -i -E \
            -e 's#https://zlib\.net/zlib-\$\{?ZLIB_VERSION\}?\.tar\.xz#https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz#' \
            -e 's#(curl[^|]*zlib[^|]*\|\s*tar\s+)xJC#\1xzC#' \
            qemu-wasm/Dockerfile
          grep -n "zlib.net\|tar x" qemu-wasm/Dockerfile || true

      - name: Build da imagem de toolchain (emsdk + libs)
        run: docker build -t buildqemu -f qemu-wasm/Dockerfile qemu-wasm

      - name: Compilar QEMU (goldfish) para WebAssembly
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/qemu-wasm:/qemu \
            buildqemu \
            /bin/bash -lc '
              cd /qemu &&
              emconfigure ./configure \
                --static \
                --cpu=wasm32 \
                --cross-prefix= \
                --target-list=arm-softmmu \
                --without-default-features \
                --enable-system \
                --with-coroutine=fiber \
                --disable-tools \
                --disable-docs \
                --extra-cflags="-DNDEBUG -Wno-error=unused-command-line-argument" \
                --extra-cxxflags="-Wno-error=unused-command-line-argument" &&
              emmake make -j$(nproc)
            '

      - name: Upload dos artefatos wasm
        uses: actions/upload-artifact@v4
        with:
          name: qemu-wasm-goldfish-build
          path: |
            qemu-wasm/build/**/*.wasm
            qemu-wasm/build/**/*.js
          if-no-files-found: warn
